<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Bishoy Cyber Security Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  body, html { margin: 0; padding: 0; background-color: #050505; height: 100%; overflow: hidden; font-family: sans-serif; }
  .hero { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #matrix { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.15; z-index: 0; }
  .logo-container { z-index: 2; text-align: center; position: relative; }
  .ring { position: absolute; top: 50%; left: 50%; border: 1px dashed #00ff9d; border-radius: 50%; transform: translate(-50%, -50%); }
  .r1 { width: 350px; height: 350px; animation: spin 20s linear infinite; }
  .r2 { width: 450px; height: 450px; border-color: #00d4ff; animation: spin 30s linear infinite reverse; }
  @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
  .skull { width: 180px; height: 180px; fill: none; stroke: #00ff9d; stroke-width: 2; filter: drop-shadow(0 0 15px #00ff9d); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { filter: drop-shadow(0 0 30px #00ff9d); } }
  h1 { font-family: 'Orbitron', sans-serif; color: #00ff9d; font-size: 40px; letter-spacing: 5px; margin: 20px 0 5px 0; text-shadow: 0 0 10px #00ff9d; }
  p { font-family: 'Share Tech Mono', monospace; color: #00d4ff; font-size: 16px; letter-spacing: 3px; margin: 0; }
</style>
</head>
<body>
<div class="hero">
  <canvas id="matrix"></canvas>
  <div class="logo-container">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <!-- رسمة جمجمة مبسطة بـ SVG -->
    <svg class="skull" viewBox="0 0 100 100">
      <path d="M50 10 C20 10 10 30 10 50 C10 70 20 85 35 85 L35 95 L65 95 L65 85 C80 85 90 70 90 50 C90 30 80 10 50 10 Z" />
      <circle cx="35" cy="50" r="8" fill="#00ff9d" />
      <circle cx="65" cy="50" r="8" fill="#00ff9d" />
      <path d="M40 75 L45 85 M60 75 L55 85" stroke-width="3" />
    </svg>
    <h1>BISHOY</h1>
    <h1 style="font-size: 24px; color: #00d4ff; text-shadow: 0 0 10px #00d4ff;">CYBER SECURITY</h1>
    <p>Ethical Hacking • Cyber Security</p>
  </div>
</div>
<script>
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const chars = 'アイウエオカキクケコ01</>{}[]'.split('');
  const fontSize = 14; const columns = canvas.width / fontSize;
  const drops = Array(Math.floor(columns)).fill(1);
  function draw() {
    ctx.fillStyle = 'rgba(5, 5, 5, 0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff9d'; ctx.font = fontSize + 'px monospace';
    for (let i = 0; i < drops.length; i++) {
      const text = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  setInterval(draw, 50);
</script>
</body>
</html>
